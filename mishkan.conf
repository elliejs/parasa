# mishkan.conf -- Mishkan-wide build defaults.
#
# Per-target build.conf files override values set here.
# Format: sysrc(8) compatible (VAR=value, one per line).
#
# Query with: sysrc -f mishkan.conf VAR
# Override in: minhag/systems/<name>/build.conf
#            or minhag/containers/<name>/build.conf

# FreeBSD source branch to build from.
# SRC_BRANCH=stable/15

# Kernel configuration file (relative to sys/). Empty = GENERIC.
# KERNCONF=GENERIC
