# jail.conf -- Default jail configuration for parasa containers.
#
# This file provides shared defaults for all containers. Per-container
# overrides live in recipes/containers/<name>/jail.conf, which are
# included via the .include directive below.
#
# See jail.conf(5) for full documentation.

# ── Shared defaults ────────────────────────────────────────────────────────

exec.start = "/bin/sh /etc/rc";
exec.stop  = "/bin/sh /etc/rc.shutdown";
exec.clean;
mount.devfs;
devfs_ruleset = 4;

# ── Per-container configs ──────────────────────────────────────────────────
# Each container's jail.conf overrides or extends these defaults.

.include "/zshemot/parasa/recipes/containers/*/jail.conf";
