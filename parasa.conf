# parasa.conf -- Parasa-wide build defaults.
#
# Per-foundation .conf files in the recipes repo override values set here.
# Format: sysrc(8) compatible (VAR=value, one per line).
#
# Query with: sysrc -f parasa.conf VAR
# Override in: recipes/foundations/<name>.conf (in parasa-recipes repo)

# FreeBSD source branch to build from.
# SRC_BRANCH=stable/15

# Kernel configuration file (relative to sys/). Empty = GENERIC.
# KERNCONF=GENERIC
